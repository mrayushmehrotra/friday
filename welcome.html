<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRIDAY | Personal Intelligence Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
      :root {
        --bg-primary: #0a0e27;
        --bg-secondary: #111b3c;
        --bg-tertiary: #1a2847;
        --surface: #151f3f;
        --surface-hover: #1d2a52;
        --border: #2d3e6f;
        --border-light: #3d4e7f;
        --text-primary: #e8ecf1;
        --text-secondary: #a8b5c8;
        --text-muted: #6b7a94;
        --accent-primary: #00d4ff;
        --accent-secondary: #6366f1;
        --accent-tertiary: #a78bfa;
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
        --info: #3b82f6;
        --glow-primary: rgba(0, 212, 255, 0.15);
        --glow-secondary: rgba(99, 102, 241, 0.15);
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);
        --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.6);
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: var(--font-main);
        background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-primary) 100%);
        background-attachment: fixed;
        color: var(--text-primary);
        min-height: 100vh;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      /* Animated Background */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 20% 50%, rgba(0, 212, 255, 0.05) 0%, transparent 50%),
                    radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
        pointer-events: none;
        z-index: -1;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-primary);
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, var(--accent-primary), var(--accent-secondary));
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, var(--accent-secondary), var(--accent-tertiary));
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 40px 20px;
        position: relative;
        z-index: 1;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding-bottom: 32px;
        margin-bottom: 40px;
        border-bottom: 2px solid var(--border);
        opacity: 0;
        animation: slideInDown 0.8s ease-out forwards;
      }

      @keyframes slideInDown {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      header h1 {
        font-size: 3rem;
        font-weight: 900;
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary), var(--accent-tertiary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.03em;
        line-height: 1;
        margin-bottom: 8px;
        text-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
      }

      header .greeting {
        color: var(--text-secondary);
        font-size: 1.1rem;
        font-weight: 400;
        letter-spacing: 0.02em;
      }

      header .time {
        color: var(--text-muted);
        font-size: 0.95rem;
        font-family: var(--font-mono);
        text-align: right;
        padding: 12px 20px;
        background: rgba(99, 102, 241, 0.1);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        backdrop-filter: blur(10px);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 28px;
      }

      .full {
        grid-column: span 12;
      }

      .span-6 {
        grid-column: span 6;
      }

      .span-4 {
        grid-column: span 4;
      }

      .card {
        background: rgba(21, 31, 63, 0.6);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 28px;
        box-shadow: var(--shadow-md);
        backdrop-filter: blur(10px);
        transition: var(--transition);
        position: relative;
        overflow: hidden;
        opacity: 0;
        animation: fadeInUp 0.6s ease-out forwards;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
        transition: left 0.5s ease;
      }

      .card:hover::before {
        left: 100%;
      }

      .card:hover {
        border-color: var(--accent-primary);
        box-shadow: 0 0 30px rgba(0, 212, 255, 0.2), var(--shadow-lg);
        transform: translateY(-4px);
      }

      .card h2 {
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: relative;
      }

      .card h2::before {
        content: "";
        position: absolute;
        bottom: -12px;
        left: 0;
        width: 40px;
        height: 3px;
        background: linear-gradient(90deg, var(--accent-primary), transparent);
        border-radius: 2px;
      }

      .card h2 span {
        text-transform: none;
        letter-spacing: normal;
        font-weight: 400;
        color: var(--text-muted);
      }

      /* Command Bar */
      .cmd-bar {
        display: flex;
        gap: 12px;
        align-items: center;
        background: rgba(21, 31, 63, 0.6);
        padding: 4px 4px 4px 24px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow-md);
      }

      .cmd-bar input {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text-primary);
        font-size: 1.05rem;
        outline: none;
        padding: 14px 0;
        font-weight: 500;
      }

      .cmd-bar input::placeholder {
        color: var(--text-muted);
      }

      .cmd-bar input:focus {
        color: var(--accent-primary);
      }

      .btn {
        padding: 10px 24px;
        border: none;
        border-radius: var(--radius-md);
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        white-space: nowrap;
      }

      .btn::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
      }

      .btn:hover::before {
        width: 300px;
        height: 300px;
      }

      .btn:hover {
        box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        transform: translateY(-2px);
      }

      .btn:active {
        transform: translateY(0) scale(0.98);
      }

      .btn-secondary {
        background: rgba(99, 102, 241, 0.2);
        color: var(--text-primary);
        border: 1px solid var(--border-light);
      }

      .btn-secondary:hover {
        background: rgba(99, 102, 241, 0.3);
        border-color: var(--accent-secondary);
      }

      /* Chips */
      .quick-chips {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 20px;
        margin-bottom: 12px;
      }

      .chip {
        padding: 8px 18px;
        border: 1px solid var(--border);
        border-radius: 24px;
        cursor: pointer;
        font-size: 0.85rem;
        color: var(--text-secondary);
        background: rgba(99, 102, 241, 0.1);
        transition: var(--transition);
        position: relative;
        overflow: hidden;
      }

      .chip::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.2), transparent);
        transition: left 0.5s ease;
      }

      .chip:hover {
        border-color: var(--accent-primary);
        color: var(--accent-primary);
        background: var(--glow-primary);
        transform: translateY(-2px);
      }

      .chip:hover::before {
        left: 100%;
      }

      #response {
        margin: 20px 0;
        color: var(--accent-primary);
        font-size: 0.95rem;
        min-height: 24px;
        font-family: var(--font-mono);
        padding: 12px 16px;
        background: rgba(0, 212, 255, 0.05);
        border-left: 3px solid var(--accent-primary);
        border-radius: var(--radius-sm);
        opacity: 0;
      }

      #response.active {
        animation: slideInLeft 0.4s ease-out forwards;
      }

      @keyframes slideInLeft {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      /* Lists */
      .todo-item, .news-item, .stock-ticker, .server-item {
        padding: 14px 0;
        border-bottom: 1px solid var(--border);
        transition: var(--transition);
      }

      .todo-item:last-child, .news-item:last-child, .stock-ticker:last-child, .server-item:last-child {
        border-bottom: none;
      }

      .todo-item:hover, .news-item:hover, .stock-ticker:hover, .server-item:hover {
        background: rgba(99, 102, 241, 0.05);
        padding-left: 8px;
        padding-right: 8px;
        margin-left: -8px;
        margin-right: -8px;
        border-radius: var(--radius-sm);
      }

      /* Stock Ticker Specific */
      .stock-ticker {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .stock-ticker .sym {
        font-weight: 700;
        font-size: 0.95rem;
        color: var(--text-primary);
        width: 80px;
        font-family: var(--font-mono);
      }

      .stock-ticker .price {
        font-family: var(--font-mono);
        font-size: 0.95rem;
        color: var(--text-secondary);
      }

      .stock-ticker .chg {
        font-size: 0.9rem;
        font-weight: 600;
        font-family: var(--font-mono);
      }

      .stock-ticker .chg.pos { color: var(--success); }
      .stock-ticker .chg.neg { color: var(--danger); }

      .remove-stock {
        opacity: 0.5;
        transition: var(--transition);
        cursor: pointer;
      }

      .remove-stock:hover {
        opacity: 1;
        color: var(--danger) !important;
        transform: scale(1.2) rotate(90deg);
      }

      /* News Item Specific */
      .news-item .title {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .news-item .title a {
        color: var(--text-primary);
        text-decoration: none;
        transition: var(--transition);
        position: relative;
      }

      .news-item .title a::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        transition: width 0.3s ease;
      }

      .news-item .title a:hover {
        color: var(--accent-primary);
      }

      .news-item .title a:hover::after {
        width: 100%;
      }

      .news-item .meta {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-bottom: 8px;
        font-family: var(--font-mono);
      }

      .news-item .summary {
        font-size: 0.9rem;
        color: var(--text-secondary);
        line-height: 1.5;
      }

      /* Todo Editor */
      #todo-editor {
        width: 100%;
        height: 320px;
        background: rgba(10, 14, 39, 0.8);
        color: var(--text-primary);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 16px;
        font-family: var(--font-mono);
        font-size: 0.9rem;
        resize: vertical;
        outline: none;
        transition: var(--transition);
        backdrop-filter: blur(5px);
      }

      #todo-editor:focus {
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 3px var(--glow-primary);
      }

      /* P&L Tracker */
      .pnl-form {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .pnl-form input, .stock-add-form input {
        background: rgba(10, 14, 39, 0.8);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        padding: 10px 14px;
        font-size: 0.9rem;
        outline: none;
        transition: var(--transition);
        backdrop-filter: blur(5px);
      }

      .pnl-form input:focus, .stock-add-form input:focus {
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 3px var(--glow-primary);
      }

      #pnl-summary {
        background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(99, 102, 241, 0.1));
        padding: 16px 20px;
        border-radius: var(--radius-md);
        margin-bottom: 20px;
        font-size: 0.9rem;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        border-left: 4px solid var(--accent-primary);
        backdrop-filter: blur(10px);
      }

      #pnl-summary .positive { color: var(--success); font-weight: 600; }
      #pnl-summary .negative { color: var(--danger); font-weight: 600; }

      .pnl-chart-container {
        width: 100%;
        height: 200px;
        margin-top: 20px;
        position: relative;
      }

      .pnl-chart-container canvas {
        filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.1));
      }

      /* Loading & Error */
      .loading {
        text-align: center;
        padding: 50px 20px;
        color: var(--text-muted);
        font-style: italic;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }

      .error {
        color: var(--danger);
        background: rgba(239, 68, 68, 0.1);
        padding: 12px 16px;
        border-radius: var(--radius-md);
        font-size: 0.85rem;
        border-left: 3px solid var(--danger);
      }

      .empty {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-muted);
        font-style: italic;
      }

      /* Stagger Animation */
      .card:nth-child(1) { animation-delay: 0.1s; }
      .card:nth-child(2) { animation-delay: 0.2s; }
      .card:nth-child(3) { animation-delay: 0.3s; }
      .card:nth-child(4) { animation-delay: 0.4s; }
      .card:nth-child(5) { animation-delay: 0.5s; }
      .card:nth-child(6) { animation-delay: 0.6s; }

      /* Responsive */
      @media (max-width: 1024px) {
        .span-6, .span-4 {
          grid-column: span 12;
        }
      }

      @media (max-width: 768px) {
        .container { padding: 20px; }
        header { flex-direction: column; align-items: flex-start; gap: 16px; }
        header h1 { font-size: 2.2rem; }
        header .time { text-align: left; width: 100%; }
        .pnl-form { flex-direction: column; }
        .pnl-form input { width: 100%; }
        .grid { gap: 20px; }
        .card { padding: 20px; }
      }

      @media (max-width: 480px) {
        header h1 { font-size: 1.8rem; }
        .quick-chips { gap: 8px; }
        .chip { padding: 6px 12px; font-size: 0.8rem; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div>
          <h1>FRIDAY</h1>
          <div class="greeting" id="greeting">Welcome home, sir.</div>
        </div>
        <div class="time" id="clock"></div>
      </header>

      <div class="card full cmd-bar">
        <input
          type="text"
          id="cmd-input"
          placeholder="Type a command for Jarvis..."
          autofocus
        />
        <button class="btn" id="cmd-btn">Send</button>
      </div>

      <div class="quick-chips">
        <span class="chip" data-cmd="time">What's the time?</span>
        <span class="chip" data-cmd="news">Stock news</span>
        <span class="chip" data-cmd="todos">My todos</span>
        <span class="chip" data-cmd="briefing">Daily briefing</span>
        <span class="chip" data-cmd="stock price RELIANCE">RELIANCE price</span>
        <span class="chip" data-cmd="stock price TCS">TCS price</span>
        <span class="chip" data-cmd="nifty 50">Nifty 50</span>
        <span class="chip" data-cmd="sensex">Sensex</span>
        <span class="chip" data-cmd="open video uploader">Open uploader</span>
        <span class="chip" data-cmd="open stock dashboard">Stock dashboard</span>
      </div>

      <div id="response"></div>

      <div class="grid">
        <div class="card full" id="todo-card">
          <h2>
            TODO.txt
            <span>(editable)</span>
          </h2>
          <textarea id="todo-editor" spellcheck="false"></textarea>
          <div style="display: flex; gap: 12px; margin-top: 20px; align-items: center;">
            <button id="todo-save-btn" class="btn">Save Changes</button>
            <span id="todo-status" style="color: var(--success); font-size: 0.9rem; font-weight: 500;"></span>
          </div>
        </div>

        <div class="card span-6" id="stocks-card">
          <h2>Market Watch</h2>
          <div class="stock-add-form" style="display:flex; gap:10px; margin-bottom:20px">
            <input type="text" id="watch-input" placeholder="Add ticker (e.g. RELIANCE)" style="flex:1">
            <button id="watch-add-btn" class="btn">Add</button>
          </div>
          <div id="stocks-list"><div class="loading">Fetching market data...</div></div>
        </div>

        <div class="card span-6" id="pnl-card">
          <h2>P&L Tracker</h2>
          <div class="pnl-form">
            <input type="number" id="pnl-wallet" placeholder="Wallet (₹)" step="any" style="width: 140px" />
            <input type="number" id="pnl-pl" placeholder="Today P&L (₹)" step="any" style="width: 140px" />
            <button class="btn" id="pnl-btn">Save</button>
            <button class="btn btn-secondary" id="pnl-reset">Reset</button>
          </div>
          <div id="pnl-summary"></div>
          <div class="pnl-chart-container">
            <canvas id="pnl-chart"></canvas>
          </div>
        </div>

        <div class="card span-6" id="servers-card">
          <h2>System Status</h2>
          <div id="servers-list"><div class="loading">Checking systems...</div></div>
        </div>

        <div class="card full" id="news-card">
          <h2>Stock News</h2>
          <div id="news-list"><div class="loading">Scanning news feeds...</div></div>
        </div>
      </div>
    </div>

    <script>
      const API = "";
      const DEFAULT_WATCH = ["^NSEI","^BSESN","RELIANCE","TCS","HDFCBANK","INFY","SBIN"];

      // GSAP Animations
      function animateElement(element, options = {}) {
        gsap.to(element, {
          duration: 0.6,
          ease: "power2.out",
          ...options
        });
      }

      function animateOnHover(element) {
        element.addEventListener("mouseenter", () => {
          gsap.to(element, { duration: 0.3, y: -4, ease: "power2.out" });
        });
        element.addEventListener("mouseleave", () => {
          gsap.to(element, { duration: 0.3, y: 0, ease: "power2.out" });
        });
      }

      // Animate cards on scroll
      const observerOptions = {
        threshold: 0.1,
        rootMargin: "0px 0px -50px 0px"
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            gsap.to(entry.target, {
              opacity: 1,
              y: 0,
              duration: 0.6,
              ease: "power2.out"
            });
            observer.unobserve(entry.target);
          }
        });
      }, observerOptions);

      document.querySelectorAll(".card").forEach(card => {
        observer.observe(card);
      });

      // Animate response messages
      function showResponse(text) {
        const resp = document.getElementById("response");
        resp.textContent = text;
        resp.classList.add("active");
        gsap.fromTo(resp, 
          { opacity: 0, x: -20 },
          { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }
        );
      }

      // Animate list items
      function animateListItems(container) {
        const items = container.querySelectorAll(".stock-ticker, .news-item, .todo-item");
        gsap.fromTo(items,
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.4, stagger: 0.05, ease: "power2.out" }
        );
      }

      function getWatchlist() {
        try { return JSON.parse(localStorage.getItem("friday_watch")) || DEFAULT_WATCH; }
        catch(e) { return DEFAULT_WATCH; }
      }
      function setWatchlist(list) {
        localStorage.setItem("friday_watch", JSON.stringify(list));
      }

      function clock() {
        const now = new Date();
        document.getElementById("clock").textContent = now.toLocaleString(
          "en-IN",
          {
            weekday: "long",
            day: "numeric",
            month: "long",
            hour: "2-digit",
            minute: "2-digit",
          },
        );
        const h = now.getHours();
        let period = "morning";
        if (h >= 12 && h < 17) period = "afternoon";
        else if (h >= 17) period = "evening";
        document.getElementById("greeting").textContent =
          `Good ${period}, sir.`;
      }
      setInterval(clock, 10000);
      clock();

      async function fetchAPI(url) {
        const r = await fetch(url);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      }

      async function loadTodofile() {
        const ta = document.getElementById("todo-editor");
        try {
          const res = await fetchAPI(API + "/api/todofile");
          ta.value = res.content || "";
          gsap.to(ta, { duration: 0.3, opacity: 1 });
        } catch (e) {
          ta.value = "Error loading: " + e.message;
        }
      }

      document
        .getElementById("todo-save-btn")
        .addEventListener("click", async () => {
          const content = document.getElementById("todo-editor").value;
          const status = document.getElementById("todo-status");
          try {
            await fetchAPI(
              API + "/api/todofile?content=" + encodeURIComponent(content),
            );
            status.textContent = "✓ Saved successfully";
            gsap.to(status, { duration: 0.3, opacity: 1, scale: 1.1 });
            gsap.to(status, { duration: 0.3, opacity: 1, scale: 1, delay: 1.7 });
            setTimeout(() => (status.textContent = ""), 2000);
          } catch (e) {
            status.textContent = "Error: " + e.message;
          }
        });

      async function loadStocks() {
        const el = document.getElementById("stocks-list");
        const list = getWatchlist();
        if (!list.length) { el.innerHTML = '<div class="empty">No stocks. Add one above.</div>'; return; }
        try {
          const html = [];
          for (const t of list) {
            try {
              const d = await fetchAPI(API + `/api/quote?ticker=${t}`);
              const chg = d.change || 0,
                cls = chg >= 0 ? "pos" : "neg",
                sign = chg >= 0 ? "+" : "";
              const sym = d.symbol.replace(".NS", "").replace("^", "");
              html.push(
                `<div class="stock-ticker"><span class="sym">${sym}</span><span class="price">₹${fmt(d.price)}</span><span class="chg ${cls}">${sign}${fmt(chg)} (${sign}${fmt(d.change_pct)}%)</span><span class="remove-stock" data-ticker="${t}" style="margin-left:auto;color:var(--text-muted);cursor:pointer;font-size:1.4rem">&times;</span></div>`,
              );
            } catch (e) {
              html.push(
                `<div class="stock-ticker"><span class="sym">${t}</span><span class="error">error</span><span class="remove-stock" data-ticker="${t}" style="margin-left:auto;color:var(--text-muted);cursor:pointer;font-size:1.4rem">&times;</span></div>`,
              );
            }
          }
          el.innerHTML = html.join("");
          animateListItems(el);
          document.querySelectorAll(".remove-stock").forEach(function(btn) {
            btn.addEventListener("click", function() {
              var t = btn.dataset.ticker;
              gsap.to(btn.parentElement, { duration: 0.3, opacity: 0, x: 20, onComplete: () => {
                var list2 = getWatchlist().filter(function(x) { return x !== t; });
                setWatchlist(list2);
                loadStocks();
              }});
            });
          });
        } catch (e) {
          el.innerHTML = `<div class="error">${e.message}</div>`;
        }
      }

      async function loadNews() {
        const el = document.getElementById("news-list");
        try {
          const res = await fetchAPI(API + "/api/news?count=10");
          if (!res.news || res.news.length === 0) {
            el.innerHTML = '<div class="empty">No news available.</div>';
            return;
          }
          el.innerHTML = res.news
            .map((a) => {
              const title = a.title || "Untitled",
                link = a.link || "#";
              const pub = a.publisher || "",
                date = a.pub_date
                  ? new Date(a.pub_date).toLocaleDateString()
                  : "";
              const summary = a.summary
                ? a.summary.replace(/<[^>]+>/g, "").substring(0, 200)
                : "";
              return (
                `<div class="news-item"><div class="title"><a href="${link}" target="_blank">${esc(title)}</a></div>` +
                `<div class="meta">${[pub, date].filter(Boolean).join(" · ")}</div>` +
                (summary
                  ? `<div class="summary">${esc(summary)}...</div>`
                  : "") +
                "</div>"
              );
            })
            .join("");
          animateListItems(el);
        } catch (e) {
          el.innerHTML = `<div class="error">${e.message}</div>`;
        }
      }

      function fmt(n) {
        if (n === null || n === undefined) return "—";
        if (typeof n === "number") {
          if (Math.abs(n) >= 1e12) return (n / 1e12).toFixed(2) + "T";
          if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(2) + "B";
          if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2) + "M";
          if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(2) + "K";
          return n.toFixed(2);
        }
        return n;
      }

      function esc(s) {
        const d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
      }

      document.getElementById("cmd-btn").addEventListener("click", sendCommand);
      document.getElementById("cmd-input").addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendCommand();
      });

      async function sendCommand() {
        const input = document.getElementById("cmd-input");
        const text = input.value.trim();
        if (!text) return;
        showResponse("Jarvis: " + text);
        input.value = "";
        try {
          await fetchAPI(API + `/api/command?text=${encodeURIComponent(text)}`);
          if (
            text.toLowerCase().includes("remember") ||
            text.toLowerCase().includes("todo") ||
            text.toLowerCase().includes("task")
          ) {
            loadTodofile();
          }
        } catch (e) {
          showResponse("Error: " + e.message);
        }
      }

      document.querySelectorAll(".chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          document.getElementById("cmd-input").value = chip.dataset.cmd;
          sendCommand();
        });
        animateOnHover(chip);
      });

      function drawPnlChart(data) {
        const canvas = document.getElementById("pnl-chart");
        if (!canvas || data.length < 2) return;
        const ctx = canvas.getContext("2d");
        const rect = canvas.parentElement.getBoundingClientRect();
        const W = (canvas.width = rect.width || 600);
        const H = (canvas.height = 200);
        const pad = { t: 20, r: 20, b: 30, l: 60 };
        const cw = W - pad.l - pad.r,
          ch = H - pad.t - pad.b;

        const vals = data.map((d) => d.wallet);
        const min = Math.min(...vals),
          max = Math.max(...vals),
          range = max - min || 1;
        const labels = data.map((d) => d.date.slice(5));

        ctx.clearRect(0, 0, W, H);
        
        // Grid Lines
        ctx.strokeStyle = "rgba(61, 78, 127, 0.5)";
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 5]);
        for (let i = 0; i <= 3; i++) {
          const y = pad.t + (ch * i) / 3;
          ctx.beginPath();
          ctx.moveTo(pad.l, y);
          ctx.lineTo(W - pad.r, y);
          ctx.stroke();
          ctx.fillStyle = "rgba(168, 181, 200, 0.6)";
          ctx.font = "10px SFMono-Regular, Consolas, monospace";
          ctx.textAlign = "right";
          ctx.fillText("₹" + (max - (i * range) / 3).toFixed(0), pad.l - 8, y + 3);
        }
        ctx.setLineDash([]);

        // Gradient Line
        const gradient = ctx.createLinearGradient(0, pad.t, 0, pad.t + ch);
        gradient.addColorStop(0, "rgba(0, 212, 255, 1)");
        gradient.addColorStop(1, "rgba(99, 102, 241, 0.5)");
        
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 3;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.beginPath();
        data.forEach((d, i) => {
          const x = pad.l + (i / (data.length - 1)) * cw;
          const y = pad.t + ch - ((d.wallet - min) / range) * ch;
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        });
        ctx.stroke();

        // Area Gradient
        const areaGradient = ctx.createLinearGradient(0, pad.t, 0, pad.t + ch);
        areaGradient.addColorStop(0, "rgba(0, 212, 255, 0.2)");
        areaGradient.addColorStop(1, "rgba(99, 102, 241, 0.05)");
        ctx.fillStyle = areaGradient;
        ctx.lineTo(pad.l + cw, pad.t + ch);
        ctx.lineTo(pad.l, pad.t + ch);
        ctx.closePath();
        ctx.fill();

        // Labels
        ctx.fillStyle = "rgba(168, 181, 200, 0.6)";
        ctx.font = "10px SFMono-Regular, Consolas, monospace";
        ctx.textAlign = "center";
        const step = Math.max(1, Math.floor(data.length / 5));
        for (let i = 0; i < data.length; i += step) {
          ctx.fillText(labels[i], pad.l + (i / (data.length - 1)) * cw, H - 5);
        }
      }

      async function loadPnl() {
        const summary = document.getElementById("pnl-summary");
        try {
          const res = await fetchAPI(API + "/api/pnl");
          const entries = res.entries || [];
          if (entries.length === 0) {
            summary.innerHTML =
              '<span style="color:var(--text-muted)">No entries yet. Start tracking above.</span>';
            return;
          }
          const last = entries[entries.length - 1];
          const totalPl = entries.reduce((s, e) => s + e.pl, 0);
          const cls = totalPl >= 0 ? "positive" : "negative";
          const sign = totalPl >= 0 ? "+" : "";
          summary.innerHTML = `<div>Wallet: <strong>\u20B9${fmt(last.wallet)}</strong></div> <div class="${cls}">Total P&L: ${sign}\u20B9${fmt(totalPl)}</div> <div style="color:var(--text-muted)">${entries.length} entries</div>`;
          setTimeout(() => drawPnlChart(entries), 50);
        } catch (e) {
          summary.innerHTML = `<span class="error">${e.message}</span>`;
        }
      }

      document.getElementById("pnl-btn").addEventListener("click", async () => {
        const wallet = document.getElementById("pnl-wallet").value;
        const pl = document.getElementById("pnl-pl").value;
        if (!wallet || pl === "") return;
        try {
          await fetchAPI(
            API +
              `/api/pnl?wallet=${encodeURIComponent(wallet)}&pl=${encodeURIComponent(pl)}`,
          );
          document.getElementById("pnl-wallet").value = "";
          document.getElementById("pnl-pl").value = "";
          gsap.to("#pnl-wallet, #pnl-pl", { duration: 0.3, opacity: 0.5, onComplete: () => {
            gsap.to("#pnl-wallet, #pnl-pl", { duration: 0.3, opacity: 1 });
          }});
          loadPnl();
        } catch (e) {
          document.getElementById("pnl-summary").innerHTML =
            `<span class="error">${e.message}</span>`;
        }
      });

      document
        .getElementById("pnl-reset")
        .addEventListener("click", async () => {
          if (!confirm("Reset all P&L data? This cannot be undone.")) return;
          try {
            await fetchAPI(API + "/api/pnl?reset=1");
            loadPnl();
          } catch (e) {
            document.getElementById("pnl-summary").innerHTML =
              `<span class="error">${e.message}</span>`;
          }
        });

      async function loadServers() {
        const el = document.getElementById("servers-list");
        try {
          const res = await fetchAPI(API + "/api/server?action=status");
          const svr = res.servers || {};
          const names = {
            upload: "Upload Service",
            stock: "Market Engine",
            welcome: "Dashboard Core",
          };
          el.innerHTML = Object.entries(names)
            .map(([k, label]) => {
              const on = svr[k];
              return (
                '<div class="server-item" style="display:flex;align-items:center;justify-content:space-between;font-size:0.95rem">' +
                "<span>" +
                label +
                " " +
                (on
                  ? '<span style="color:var(--success);margin-left:8px;font-size:0.8rem">● Online</span>'
                  : '<span style="color:var(--text-muted);margin-left:8px;font-size:0.8rem">○ Offline</span>') +
                "</span>" +
                '<div style="display:flex;gap:8px">' +
                '<button class="btn btn-secondary svr-btn" data-name="' +
                k +
                '" data-action="open" style="padding:6px 12px;font-size:0.8rem">Start</button>' +
                '<button class="btn btn-secondary svr-btn" data-name="' +
                k +
                '" data-action="close" style="padding:6px 12px;font-size:0.8rem;color:var(--danger)">Stop</button>' +
                "</div></div>"
              );
            })
            .join("");
          animateListItems(el);
          document.querySelectorAll(".svr-btn").forEach(function (btn) {
            btn.addEventListener("click", async function () {
              var name = btn.dataset.name;
              var action = btn.dataset.action;
              if (name === "welcome" && action === "close") {
                if (
                  confirm(
                    "Close the welcome dashboard? This page will stop working.",
                  )
                ) {
                  await fetchAPI(API + "/api/server?action=close&name=welcome");
                  gsap.to("body", { duration: 0.5, opacity: 0, onComplete: () => {
                    document.body.innerHTML =
                      '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-muted);font-family:var(--font-mono);font-size:1.2rem">DASHBOARD_OFFLINE</div>';
                  }});
                }
                return;
              }
              try {
                await fetchAPI(
                  API + "/api/server?action=" + action + "&name=" + name,
                );
                if (action === "open" && name !== "welcome") {
                  window.open(
                    name === "upload"
                      ? "http://localhost:3000"
                      : "http://localhost:9090",
                    "_blank",
                  );
                }
                setTimeout(loadServers, 1000);
              } catch (e) {
                console.error(e);
              }
            });
          });
        } catch (e) {
          el.innerHTML = '<div class="error">' + e.message + "</div>";
        }
      }

      document.getElementById("watch-add-btn").addEventListener("click", function() {
        var input = document.getElementById("watch-input");
        var ticker = input.value.trim().toUpperCase();
        if (!ticker) return;
        var list = getWatchlist();
        if (list.indexOf(ticker) === -1) list.push(ticker);
        setWatchlist(list);
        input.value = "";
        gsap.to(input, { duration: 0.3, opacity: 0.5, onComplete: () => {
          gsap.to(input, { duration: 0.3, opacity: 1 });
        }});
        loadStocks();
      });
      document.getElementById("watch-input").addEventListener("keydown", function(e) {
        if (e.key === "Enter") document.getElementById("watch-add-btn").click();
      });

      // Animate buttons on hover
      document.querySelectorAll(".btn").forEach(btn => {
        animateOnHover(btn);
      });

      loadTodofile();
      loadStocks();
      loadNews();
      loadPnl();
      loadServers();
    </script>
  </body>
</html>
