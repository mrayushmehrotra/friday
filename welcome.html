<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRYPTO PUMP</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        background: #0a0e27;
        color: #e8ecf1;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        background: #111b3c;
        border-bottom: 1px solid #2d3e6f;
      }
      header h1 {
        font-size: 18px;
        letter-spacing: 2px;
        color: #00d4ff;
      }
      main {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        height: calc(100% - 47px);
      }
      .frame {
        height: 100%;
      }
      .frame + .frame {
        border-left: 1px solid #2d3e6f;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
          grid-template-rows: repeat(3, 1fr);
          height: calc(100% - 47px);
        }
        .frame + .frame {
          border-left: 0;
          border-top: 1px solid #2d3e6f;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>CRYPTO PUMP</h1>
      <span>FRIDAY</span>
    </header>
    <main>
      <div class="frame">
        <iframe
          src="https://trade.phantom.com/"
          title="Phantom"
          allow="clipboard-write; crypto; autoplay"
        ></iframe>
      </div>
      <div class="frame">
        <iframe
          src="https://trade.padre.gg/trenches"
          title="Padre"
          allow="clipboard-write; crypto; autoplay"
        ></iframe>
      </div>
      <div class="frame">
        <iframe
          src="https://axiom.trade/discover?chain=sol&pulseChains=sol,robinhood,bnb&trackerChains=sol,robinhood,bnb,eth"
          title="Axiom"
          allow="clipboard-write; crypto; autoplay"
        ></iframe>
      </div>
    </main>
  </body>
</html>
